name: Build ArshiaVPN

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build APK
      run: |
        # پیدا کردن مسیر فایل gradlew به صورت خودکار
        GRADLE_PATH=$(dirname $(find . -name "gradlew" | head -1))
        echo "Found gradlew in: $GRADLE_PATH"
        cd $GRADLE_PATH
        
        # دادن دسترسی و ساخت برنامه
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: ArshiaVPN-App
        # جستجوی خودکار فایل APK در تمام پوشه‌ها
        path: '**/app/build/outputs/apk/**/*.apk'
