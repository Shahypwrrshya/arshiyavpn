name: Build ArshiaVPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: 2. Setup Java JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. Download Core Engine (libv2ray)
      run: |
        # پیدا کردن مسیر پروژه و ساخت پوشه کتابخانه‌ها
        WORK_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        cd $WORK_DIR
        mkdir -p app/libs
        # دانلود هسته اصلی فیلترشکن
        wget -O app/libs/libv2ray.aar https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar || wget -O app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

    - name: 4. Build APK
      run: |
        WORK_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        cd $WORK_DIR
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 5. Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: ArshiaVPN-Final-App
        path: '**/app/build/outputs/apk/**/*.apk'
