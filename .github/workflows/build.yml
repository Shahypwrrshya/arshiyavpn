name: Build ArshiaVPN

on:
  workflow_dispatch: # این خط باعث می‌شود دکمه اجرای دستی به گیت‌هاب اضافه شود

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code and Submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # بسیار مهم: دانلود هسته اصلی فیلترشکن

    - name: 2. Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. Setup Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # موتور v2ray به این زبان نیاز دارد

    - name: 4. Find and Build APK
      run: |
        # پیدا کردن مسیر دقیق فایل gradlew و اجرای آن
        WORK_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
        echo "Building in directory: $WORK_DIR"
        cd $WORK_DIR
        
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 5. Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: ArshiaVPN-Final-App
        path: '**/app/build/outputs/apk/debug/*.apk'
